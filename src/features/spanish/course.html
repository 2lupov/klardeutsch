<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Испанский с нуля</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&family=Literata:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<style>
:root{
  --bg:#F6F2EA;--panel:#FFFFFF;--ink:#1F2430;--ink2:#5A6275;--ink3:#8B91A0;--line:#E7E1D4;
  --acc:#C8502A;--acc2:#A63F1E;--accSoft:#FBE9E1;
  --ok:#1E7B5A;--okSoft:#E2F3EB;--warn:#A8690F;--warnSoft:#FBF0D6;--bad:#B3372E;--badSoft:#FBE4E0;
  --blue:#2F5DA8;--blueSoft:#E6EEF9;
  --r:16px;--sh:0 1px 2px rgba(60,45,20,.06),0 6px 18px rgba(60,45,20,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#F6F2EA;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:8px 16px 24px}
h1,h2,h3{font-family:Unbounded,Onest,sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0;color:var(--ink)}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}

/* верхняя строка */
.top{max-width:720px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:600 15px Unbounded,sans-serif;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.chip.hot{color:var(--acc2);background:var(--accSoft);border-color:#F2CDBE}
.chip.ok{color:var(--ok);background:var(--okSoft);border-color:#BFE3D2}

/* карточки */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.lead{color:var(--ink2);font-size:15px}
.small{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink3)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.gap{height:12px}
.sec-h{font:600 12px Onest,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 8px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid transparent;background:var(--acc);color:#fff;font-weight:600;font-size:16px;text-decoration:none}
.btn:active{background:var(--acc2)}
.btn.wide{width:100%}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--accSoft);color:var(--acc2)}
.btn.ok{background:var(--ok)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns>.btn{flex:1 1 140px}
.round{width:64px;height:64px;border-radius:50%;padding:0;flex:none}
.round .ic{width:26px;height:26px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none;padding:0}
.iconbtn.acc{background:var(--accSoft);color:var(--acc2);border-color:#F2CDBE}

/* нижняя панель */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar>div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3)}
.tab.on{color:var(--acc)}
.tab .ic{width:23px;height:23px}

/* прогресс */
.bar{height:8px;border-radius:999px;background:#EFE9DC;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px}
.bar.ok>i{background:var(--ok)}
.bar2{position:relative}
.bar2 .m{position:absolute;left:0;top:0;height:100%;background:var(--ok);border-radius:999px}
.bar2 .s{background:#F0C7B7;height:100%;border-radius:999px}

/* план дня */
.plan{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.plan:first-of-type{border-top:0}
.pn{width:38px;height:38px;border-radius:12px;background:var(--accSoft);color:var(--acc2);display:flex;align-items:center;justify-content:center;flex:none;font:600 15px Unbounded,sans-serif}
.pn.done{background:var(--okSoft);color:var(--ok)}
.plan b{display:block;font-weight:600}

/* темы */
.ut{background:hsl(var(--h) 70% 95%);border:1px solid hsl(var(--h) 45% 85%);color:hsl(var(--h) 50% 26%)}
.unit{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r);margin:10px 0;border:1px solid hsl(var(--h) 45% 85%);background:hsl(var(--h) 70% 96%)}
.unit .nm{font-weight:600;color:hsl(var(--h) 50% 22%)}
.unit .tag{width:42px;height:42px;border-radius:12px;background:hsl(var(--h) 60% 88%);color:hsl(var(--h) 55% 26%);display:flex;align-items:center;justify-content:center;font:600 14px Unbounded,sans-serif;flex:none}
.stagehd{margin:26px 2px 4px}
.stagehd h2 span{color:var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;background:#E3DCCB;flex:none}
.dot.learn{background:#E8A96E}.dot.known{background:#79B79A}.dot.master{background:var(--ok)}
.wl{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}
.wl .es{font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--blueSoft);color:var(--blue)}
.badge.ok{background:var(--okSoft);color:var(--ok)}.badge.acc{background:var(--accSoft);color:var(--acc2)}.badge.warn{background:var(--warnSoft);color:var(--warn)}

/* теория */
.less h1{margin-bottom:6px}
.sec{margin-top:22px}
.sec h2{margin-bottom:10px}
.es{font-family:Literata,Georgia,serif}
em.es{font-style:italic;color:var(--acc2);font-weight:600}
b.end{color:var(--acc);background:#FDF0EA;border-radius:4px;padding:0 2px;font-weight:700}
.tblw{overflow-x:auto;margin:10px -2px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#FAF6EC;font-weight:600;color:var(--ink2);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{padding-left:14px}
.exs{margin:10px 0}
.exl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.exl:first-child{border-top:0}
.exl .t{font-family:Literata,Georgia,serif;font-weight:600;font-size:16.5px}
.exl .r{color:var(--ink2);font-size:14px}
.note{background:var(--warnSoft);border:1px solid #F0DDB0;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px;color:#5A4210}
.errs{background:var(--badSoft);border:1px solid #F1C8C2;border-radius:12px;padding:6px 14px;margin:12px 0}
.er{padding:10px 0;border-top:1px solid #F1C8C2;font-size:14.5px}
.er:first-child{border-top:0}
.er s{color:var(--bad);text-decoration-thickness:2px}
.er b{color:var(--ok)}

/* вопросы и ввод */
.q{padding:20px 18px}
.kind{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.prompt{font:600 26px/1.25 Unbounded,sans-serif;letter-spacing:-.02em;margin:10px 0 6px;word-break:break-word}
.prompt.sm{font-size:20px}
.sub{color:var(--ink2);font-size:14.5px;margin-bottom:12px}
.inp{width:100%;min-height:52px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:600 20px Literata,Georgia,serif;background:#FFFEFB;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--acc)}
.inp.ok{border-color:var(--ok)}.inp.bad{border-color:var(--bad)}
.chars{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.chars button{min-width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:#FAF6EC;font:600 17px Literata,Georgia,serif;padding:0 8px}
.hintbox{margin:10px 0 0;font:600 20px Literata,serif;letter-spacing:.06em;color:var(--warn)}
.verdict{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-weight:700;margin-bottom:12px}
.verdict.ok{background:var(--okSoft);color:var(--ok)}
.verdict.typo{background:var(--warnSoft);color:var(--warn)}
.verdict.wrong{background:var(--badSoft);color:var(--bad)}
.answer{font:600 28px/1.25 Literata,Georgia,serif;margin:6px 0}
.cmp{background:#FAF6EC;border-radius:12px;padding:10px 14px;margin:10px 0;font:500 18px/1.6 Literata,serif}
.cmp small{display:block;font:600 11px Onest;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
mark.bad{background:#F8CFC9;color:var(--bad);border-radius:3px;text-decoration:underline wavy;text-decoration-thickness:1px}
mark.miss{background:#CDEBDD;color:var(--ok);border-radius:3px}
.rule{background:var(--blueSoft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14.5px}
.rule b.t{display:block;color:var(--blue);margin-bottom:2px}
.exbox{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin:14px 0}
.exbox .t{font:600 17px Literata,serif}
.exbox .r{color:var(--ink2);font-size:14px}
.sesstop{max-width:720px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;gap:12px}
.sesstop .bar{flex:1}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-weight:500;font-size:16px}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt[disabled]{pointer-events:none}
.ringw{display:flex;justify-content:center;margin:8px 0 14px}
.ring{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#EFE9DC 0)}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font:700 28px Unbounded,sans-serif}
.ring span{font-size:12px;color:var(--ink2)}

/* чтение / аудирование */
.read{font:400 19px/1.75 Literata,Georgia,serif}
.read p{margin:0 0 .9em}
.gw{border-bottom:2px dotted var(--acc);cursor:pointer}
.tr{background:#FAF6EC;border-radius:12px;padding:12px 14px;margin:10px 0;color:var(--ink2);font-size:15px}
#gloss{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:30;padding:0 16px;display:none}
#gloss.on{display:block}
#gloss>div{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(60,45,20,.18);padding:14px 16px}
.dl{padding:11px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dl:first-child{border-top:0}
.dl .who{font-size:12px;font-weight:700;color:var(--acc2);letter-spacing:.04em;text-transform:uppercase}
.dl.now{background:var(--accSoft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}
.dl .t{font:600 16.5px Literata,serif}
.dl .r{color:var(--ink2);font-size:14px}
.player{display:flex;align-items:center;gap:14px}

/* профиль */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font:700 22px Unbounded,sans-serif}
.stat span{font-size:12px;color:var(--ink2)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat div.col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:#EFE9DC}
.heat i.l1{background:#F4CFBF}.heat i.l2{background:#E9A68D}.heat i.l3{background:#DB7A57}.heat i.l4{background:var(--acc2)}
.heat i.fut{background:transparent}
select,textarea,.field{width:100%;border:2px solid var(--line);border-radius:12px;background:#FFFEFB;font:inherit;color:var(--ink);padding:10px 12px}
textarea{min-height:96px;font:13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
label.fl{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;max-width:90vw;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh)}
.tile .ic{width:26px;height:26px;color:var(--acc)}
.tile b{font:600 15px Unbounded,sans-serif;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--ink2)}
.lrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:8px 0}
.lrow .n{width:34px;height:34px;border-radius:10px;background:#F2ECDD;display:flex;align-items:center;justify-content:center;font:600 13px Unbounded,sans-serif;color:var(--ink2);flex:none}
.lrow.done .n{background:var(--okSoft);color:var(--ok)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-weight:600;padding:10px 0;font-size:15px}
.road{opacity:.8}
.roadlist{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
@media (min-width:600px){.prompt{font-size:30px}.wrap{padding-top:14px}}
@media (max-width:360px){.tab{font-size:10px}.prompt{font-size:22px}}

</style>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---- core ---- */
/* ===== core.js: чистая логика, без DOM ===== */
const KEY='es-course-v1';
const STEPS=[0,1,3,7,14,30,60,120];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PUNCT=/[¿¡?!.,;:"«»()…]/;
const ART=/^(el|la|los|las|un|una|unos|unas)\s+/i;

function normCh(c){c=c.toLowerCase();if(c==='ñ') return '~';return c.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function norm(s){
  return String(s).toLowerCase().replace(/ñ/g,'~').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[¿¡?!.,;:"«»()…\-–—]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function answersOf(c){
  const out=[];
  const add=a=>{if(a&&!out.includes(a)) out.push(a);};
  const base=[c.es].concat(c.alt||[]);
  base.forEach(add);
  base.forEach(a=>add(a.replace(ART,'')));
  return out;
}
/* ok: верно; typo: почти (одна опечатка); wrong: неверно */
function matchType(raw,accept){
  const u=norm(raw);
  if(!u) return 'wrong';
  let best=1e9,bl=0;
  for(const a of accept){
    const n=norm(a),d=lev(u,n);
    if(d<best){best=d;bl=n.length;}
  }
  if(best===0) return 'ok';
  const tol=bl>=20?2:(bl>=6?1:0);
  return best<=tol?'typo':'wrong';
}
function hintOf(s){
  return s.split(/\s+/).map(w=>{
    const core=w.replace(/[¿¡?!.,;:"«»()…]/g,'');
    if(core.length<=1) return w;
    return core[0]+'·'.repeat(core.length-1);
  }).join(' ');
}

/* посимвольное сравнение: что набрано неверно и чего не хватает */
function charsOf(s){return Array.from(String(s)).map(ch=>({raw:ch,n:PUNCT.test(ch)?'':normCh(ch)}));}
function lcsMark(A,B){
  const ia=[],ib=[];
  A.forEach((x,k)=>{if(x.n!=='') ia.push(k);});
  B.forEach((x,k)=>{if(x.n!=='') ib.push(k);});
  const m=ia.length,n=ib.length,dp=[];
  for(let i=0;i<=m;i++) dp.push(new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=A[ia[i-1]].n===B[ib[j-1]].n?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const okA=new Set(),okB=new Set();
  let i=m,j=n;
  while(i>0&&j>0){
    if(A[ia[i-1]].n===B[ib[j-1]].n){okA.add(ia[i-1]);okB.add(ib[j-1]);i--;j--;}
    else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--;
  }
  return {okA,okB};
}
function diffHTML(typed,correct){
  const A=charsOf(String(typed).trim().replace(/\s+/g,' ')),B=charsOf(correct);
  const {okA,okB}=lcsMark(A,B);
  const fa=A.map((x,k)=>(x.n===''||okA.has(k))?esc(x.raw):'<mark class="bad">'+esc(x.raw)+'</mark>').join('');
  const fb=B.map((x,k)=>(x.n===''||okB.has(k))?esc(x.raw):'<mark class="miss">'+esc(x.raw)+'</mark>').join('');
  return {typed:fa,correct:fb};
}
function diffSets(a,b){
  const A=charsOf(a),B=charsOf(b);
  const {okA,okB}=lcsMark(A,B);
  const set=new Set();
  A.forEach((x,k)=>{if(x.n!==''&&!okA.has(k)) set.add(x.n);});
  B.forEach((x,k)=>{if(x.n!==''&&!okB.has(k)) set.add(x.n);});
  return set;
}
/* какие правила «звук и буква» стоит напомнить после ошибки в диктанте */
function soundHints(typed,correct,rules){
  const tw=norm(typed).split(' ').filter(Boolean);
  const cwRaw=correct.toLowerCase().replace(/[¿¡?!.,;:"«»()…]/g,' ').split(/\s+/).filter(Boolean);
  const bad=[];
  cwRaw.forEach(w=>{
    const n=norm(w);
    if(tw.includes(n)) return;
    let best='',bd=1e9;
    tw.forEach(t=>{const d=lev(t,n);if(d<bd){bd=d;best=t;}});
    bad.push({w,t:best});
  });
  const out=[],seen={};
  for(const p of bad){
    const ds=diffSets(p.t,p.w);
    for(const r of rules){
      if(seen[r.id]||!r.re.test(p.w)) continue;
      let hit=false;
      for(const ch of r.l) if(ds.has(ch)) hit=true;
      if(hit){seen[r.id]=1;out.push(r);}
    }
    if(out.length>=3) break;
  }
  return {bad:bad.map(p=>p.w),rules:out.slice(0,3)};
}

/* ===== дни, серия ===== */
function dayNum(d){const x=d||new Date();return Math.floor(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())/86400000);}
function streakOf(days,today){
  let d=today;
  if(!days[d]) d=today-1;
  let n=0;
  while(days[d]){n++;d--;}
  return n;
}
function bestStreak(days){
  const ks=Object.keys(days).map(Number).sort((a,b)=>a-b);
  let best=0,cur=0,prev=null;
  ks.forEach(k=>{cur=(prev!==null&&k===prev+1)?cur+1:1;prev=k;if(cur>best) best=cur;});
  return best;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===== состояние ===== */
function fresh(today){
  return {v:1,cards:{},custom:[],done:{t:{},r:{},l:{},s:{}},days:{},
    today:{d:today||0,done:{},newN:0},journal:[],rc:{},
    set:{newN:6,rate:0.9,auto:true,voice:''},focus:'',cyc:0,started:today||0};
}
function mkCard(t,id,unit){return {id,unit,es:t[0],ru:t[1],ex:t[2]||'',exr:t[3]||'',alt:t[4]||[]};}
function buildCards(units,custom){
  const arr=[];
  units.forEach(u=>u.cards.forEach((t,i)=>arr.push(mkCard(t,u.id+'-'+(i+1),u.id))));
  (custom||[]).forEach(c=>arr.push({id:c.id,unit:'my',es:c.es,ru:c.ru,ex:c.ex||'',exr:c.exr||'',alt:[]}));
  return arr;
}
function applyReview(rec,out,today){
  const r={s:rec.s,d:rec.d,l:rec.l||0,r:(rec.r||0)+1};
  if(out==='good'){r.s=Math.min(7,r.s+1);r.d=today+STEPS[r.s];}
  else if(out==='hint'){r.d=today+Math.max(1,STEPS[r.s]);}
  else{r.l+=1;r.s=Math.max(0,r.s-2);r.d=today+1;}
  return r;
}
function dueIds(S,CARD,today){
  return Object.keys(S.cards).filter(id=>CARD[id]&&S.cards[id].d<=today)
    .sort((a,b)=>{const A=S.cards[a],B=S.cards[b];return A.d-B.d||A.s-B.s;});
}
function newIds(S,CARDS,n){
  const out=[];
  const pools=[CARDS.filter(c=>c.unit==='my'&&!S.cards[c.id])];
  if(S.focus) pools.push(CARDS.filter(c=>c.unit===S.focus&&!S.cards[c.id]));
  pools.push(CARDS.filter(c=>!S.cards[c.id]));
  for(const p of pools) for(const c of p){
    if(out.length>=n) return out;
    if(!out.includes(c.id)) out.push(c.id);
  }
  return out;
}
function unitStats(S,CARDS,uid){
  const cs=CARDS.filter(c=>c.unit===uid);
  let seen=0,mast=0;
  cs.forEach(c=>{const r=S.cards[c.id];if(r){seen++;if(r.s>=4) mast++;}});
  return {total:cs.length,seen,mast};
}
function hardIds(S,CARD,n){
  return Object.keys(S.cards).filter(id=>CARD[id]&&(S.cards[id].l||0)>=1)
    .sort((a,b)=>(S.cards[b].l-S.cards[a].l)||(S.cards[a].s-S.cards[b].s)).slice(0,n);
}
function cardState(r){
  if(!r) return 'new';
  if(r.s>=5) return 'master';
  if(r.s>=3) return 'known';
  return 'learn';
}

/* ===== «урок дня»: чередуем теорию, чтение, аудирование и орфографию ===== */
function pickLesson(S,lists){
  const kinds=['t','r','t','l','t','s'];
  for(let k=0;k<6;k++){
    const kind=kinds[((S.cyc||0)+k)%6];
    const item=lists[kind].find(x=>S.done[kind][x.id]===undefined);
    if(item) return {kind,item};
  }
  return null;
}

/* ===== резервный код ===== */
function pack(S){
  const c={};
  for(const id in S.cards){const r=S.cards[id];c[id]=[r.s,r.d,r.l||0,r.r||0];}
  const days={};
  for(const d in S.days){const x=S.days[d];days[d]=[x.r||0,x.n||0,x.q||0];}
  return {v:1,c,custom:S.custom,done:S.done,days,set:S.set,focus:S.focus,cyc:S.cyc,rc:S.rc,started:S.started};
}
function unpack(o,today){
  if(!o||o.v!==1||typeof o.c!=='object'||o.c===null) return null;
  const S=fresh(today);
  for(const id in o.c){
    const a=o.c[id];
    if(Array.isArray(a)&&a.length>=4) S.cards[id]={s:a[0]|0,d:a[1]|0,l:a[2]|0,r:a[3]|0};
  }
  if(Array.isArray(o.custom)) S.custom=o.custom.filter(x=>x&&typeof x.es==='string'&&typeof x.ru==='string'&&typeof x.id==='string');
  if(o.done&&typeof o.done==='object') ['t','r','l','s'].forEach(k=>{if(o.done[k]&&typeof o.done[k]==='object') S.done[k]=o.done[k];});
  if(o.days&&typeof o.days==='object') for(const d in o.days){const a=o.days[d];if(Array.isArray(a)) S.days[d]={r:a[0]|0,n:a[1]|0,q:a[2]|0};}
  if(o.set&&typeof o.set==='object') S.set=Object.assign(S.set,o.set);
  if(typeof o.focus==='string') S.focus=o.focus;
  if(typeof o.cyc==='number') S.cyc=o.cyc;
  if(o.rc&&typeof o.rc==='object') S.rc=o.rc;
  if(typeof o.started==='number') S.started=o.started;
  return S;
}

{id:'t1',lv:1,title:'Gustar: «мне нравится»',lead:'Самая нужная конструкция в быту, и в тесте именно она не получилась. Разбираем по косточкам: она устроена как в русском, только слова стоят в другом порядке.',

{h:'Логика: нравится не «я», а «мне»',p:'По-русски мы говорим «**Мне** нравится кофе». Кофе делает действие, а «мне» – тот, кому нравится. В испанском то же самое: *Me gusta el café*.\nЗначит, глагол не меняется по лицам (не *gusto*, не *gustas*!). Меняется слово «кому» и число того, что нравится.',

{h:'gusta или gustan?',p:'Смотрим на то, **что нравится**:\n• одно (существительное в ед. числе) или любое действие (инфинитив) → **gusta**\n• несколько (мн. число) → **gustan**',

{id:'t2',lv:1,title:'Глаголы-«ботинки»: e→ie, o→ue, e→i',lead:'Почему *quiero*, а не *quero*? В части глаголов гласная в корне «ломается» под ударением. Выучить правило проще, чем зубрить каждый глагол.',

{h:'e → ie: querer',p:'Так же меняются: *pensar* (думать), *empezar* (начинать), *preferir* (предпочитать), *cerrar* (закрывать), *entender* (понимать).',

{h:'o → ue: poder',p:'Так же: *volver* (возвращаться), *dormir* (спать), *encontrar* (находить), *costar* (стоить), *almorzar* (обедать), *recordar* (помнить).',

 ex:[['Soy empresaria.','Я предпринимательница.'],['Mi hermana es muy simpática.','Моя сестра очень приятная.'],['Somos de Ucrania.','Мы из Украины.'],['Son las tres.','Сейчас три часа.'],['La mesa es de madera.','Стол деревянный.'],['La fiesta es en mi casa.','Праздник у меня дома. (событие)']]},
{h:'Estar: место и состояние',p:'**Estar** – это где что-то находится и в каком состоянии оно сейчас (настроение, самочувствие, результат).',
 ex:[['Estoy en la oficina.','Я в офисе.'],['El banco está cerca.','Банк рядом.'],['Estamos cansados.','Мы устали.'],['La puerta está abierta.','Дверь открыта.'],['Estoy trabajando.','Я работаю (сейчас).']]},

 table:[['С ser','С estar'],['Es aburrido – он скучный человек','Está aburrido – ему сейчас скучно'],['Es guapa – она красивая','Está guapa – она сегодня хорошо выглядит'],['Es listo – он умный','Está listo – он готов'],['Es rico – он богатый','Está rico – это вкусно']]}
],
err:[['Estoy empresaria.','Soy empresaria.','Профессия – это суть, значит ser.'],['El banco es cerca.','El banco está cerca.','Место – всегда estar.'],['Soy cansada.','Estoy cansada.','Усталость – временное состояние.']],
quiz:[

{id:'t5',lv:1,title:'Hay, estar, tener que, hay que',lead:'Четыре конструкции, которые постоянно путают. Разбираем, чем отличаются «есть», «находится», «должен» и «надо».',
secs:[
{h:'Hay: «есть, имеется»',p:'*Hay* – неопределённое «есть». Оно не меняется по числам и после него нет *el/la* (определённого артикля), только *un/una/unos/dos/muchos* или ничего.',
 ex:[['Hay un banco cerca.','Рядом есть банк.'],['Hay dos tiendas en esta calle.','На этой улице две лавки.'],['¿Hay agua?','Вода есть?'],['No hay problema.','Нет проблем.']]},
{h:'Estar: «находится» (конкретное)',p:'Когда говорим о **конкретной** вещи (с *el, la, mi, este*), используем *estar*.',
 ex:[['El banco está en la calle Mayor.','Банк на улице Майор.'],['Mis llaves están en la mesa.','Мои ключи на столе.']],
 table:[['Hay (неопределённое)','Está/están (конкретное)'],['Hay un banco cerca.','El banco está cerca.'],['Hay unas llaves en la mesa.','Mis llaves están en la mesa.']]},
{h:'Tener que и hay que',p:'• **tener que + инфинитив** – лично должен (меняется по лицам): *Tengo que trabajar.*\n• **hay que + инфинитив** – надо вообще, всем (не меняется): *Hay que pagar.*',
 ex:[['Tengo que llamar a un cliente.','Мне нужно позвонить клиенту.'],['Tenemos que salir ya.','Нам надо идти уже сейчас.'],['Hay que reservar con tiempo.','Нужно бронировать заранее.']]}
],
err:[['Hay el banco aquí.','El banco está aquí. / Hay un banco aquí.','После hay нет el/la.'],['Tengo trabajar.','Tengo que trabajar.','Между tener и инфинитивом нужен que.'],['Hay que yo pagar.','Tengo que pagar.','Hay que – безлично, без «я».']],
quiz:[
{k:'c',q:'___ un restaurante aquí cerca.',o:['Hay','Está','Es'],a:0,e:'Неопределённое «есть» – hay.'},
{k:'c',q:'El restaurante ___ en la plaza.',o:['hay','está','es'],a:1,e:'Конкретное место – estar.'},
{k:'c',q:'Mañana ___ que madrugar.',o:['tengo','hay','estoy'],a:1,e:'Безлично «надо» – hay que.'},
{k:'f',q:'Мне нужно позвонить клиенту.',a:'Tengo que llamar a un cliente',alt:['Tengo que llamar al cliente'],e:'tener que + инфинитив.'},
{k:'f',q:'На улице есть аптека.',a:'Hay una farmacia en la calle',alt:['En la calle hay una farmacia','Hay una farmacia en esta calle'],e:'hay + неопределённое.'}
]},

{id:'t6',lv:1,title:'Возвратные глаголы: распорядок дня',lead:'«Я встаю, моюсь, одеваюсь» – в испанском такие глаголы заканчиваются на **-se** и требуют маленького слова перед собой. Это основа рассказа про свой день.',
secs:[
{h:'Как работает',p:'У возвратного глагола есть местоимение, показывающее: действие направлено на себя. *Levantar* – поднять (кого-то), *levantarse* – встать (самому).',
 table:[['yo','tú','él/ella','nosotros','vosotros','ellos'],['{me} levanto','{te} levantas','{se} levanta','{nos} levantamos','{os} levantáis','{se} levantan']]},
{h:'Частые возвратные глаголы',p:'• *levantarse* – вставать • *ducharse* – принимать душ • *vestirse* – одеваться (e→i) • *acostarse* – ложиться спать (o→ue) • *despertarse* – просыпаться (e→ie) • *llamarse* – называться • *sentarse* – садиться • *irse* – уходить, уезжать',
 ex:[['Me levanto a las siete.','Я встаю в семь.'],['Me ducho y me visto.','Я принимаю душ и одеваюсь.'],['Mi hijo se acuesta tarde.','Мой сын ложится поздно.'],['¿Cómo te llamas?','Как тебя зовут?'],['Me llamo Irina.','Меня зовут Ирина.']]},
{h:'Где ставить местоимение',p:'• перед спрягаемым глаголом: *Me levanto*\n• с инфинитивом – либо перед всей парой, либо в конце слитно: *Me voy a duchar* = *Voy a ducharme*\n• отрицание перед местоимением: *No me levanto temprano*',
 ex:[['Me voy a acostar pronto.','Я собираюсь лечь пораньше.'],['Voy a acostarme pronto.','Я собираюсь лечь пораньше.'],['No me gusta levantarme temprano.','Мне не нравится вставать рано.']]}
],
err:[['Yo levanto a las siete.','Me levanto a las siete.','Без me получается «поднимаю кого-то».'],['Me llamas Ana.','Me llamo Ana.','Me llamo – «меня зовут» (звучит как yo).'],['Voy a me duchar.','Me voy a duchar. / Voy a ducharme.','Только перед парой или в конце.']],
quiz:[
{k:'c',q:'Yo ___ a las siete.',o:['levanto','me levanto','se levanta'],a:1,e:'Возвратный: me + levanto.'},
{k:'c',q:'Ella ___ llama Carmen.',o:['me','te','se'],a:2,e:'Для ella – se.'},
{k:'c',q:'Voy a ___ pronto.',o:['acostarse','acostarme','te acostar'],a:1,e:'Для yo – acostarme.'},
{k:'f',q:'Меня зовут Ирина.',a:'Me llamo Irina',alt:['Yo me llamo Irina'],e:'Me llamo + имя.'},
{k:'f',q:'Мы ложимся поздно.',a:'Nos acostamos tarde',alt:['Nosotros nos acostamos tarde'],e:'Nos + acostamos.'}
]},

{id:'t7',lv:2,title:'Ir a + инфинитив и время в предлогах',lead:'Самый простой способ говорить о будущем: «собираюсь что-то сделать». Плюс предлоги, без которых не назвать время: в, до, с, до такого-то часа.',
secs:[
{h:'Ir a + инфинитив',p:'Спрягаем *ir*, затем **a**, затем инфинитив: «собираюсь сделать». Подходит для планов на ближайшее будущее.',
 table:[['yo','tú','él/ella','nosotros','vosotros','ellos'],['voy a','vas a','va a','vamos a','vais a','van a']],
 ex:[['Voy a llamar a mi hijo.','Я собираюсь позвонить сыну.'],['¿Qué vas a hacer mañana?','Что ты собираешься делать завтра?'],['Vamos a comer en casa.','Мы будем обедать дома.'],['Va a llover.','Будет дождь.']]},
{h:'Предлоги времени',p:'',
 table:[['Предлог','Значение','Пример'],['a las…','в (час)','Salgo a las ocho.'],['de… a…','с… до… (по времени/дням)','Trabajo de lunes a viernes.'],['desde… hasta…','с… до… (подчёркнуто)','Abro desde las nueve hasta las cinco.'],['por la mañana/tarde/noche','утром/днём/вечером','Estudio por la mañana.'],['en + месяц/сезон','в','En agosto hace calor.'],['el + день недели','в (понедельник)','El lunes tengo cita.'],['los + день недели','по (понедельникам)','Los lunes no trabajo.']],
 note:'Перед часом всегда **a las** (или **a la** перед «una»): *a las tres*, *a la una*. При указании часа дня: *a las ocho de la mañana*, *a las diez de la noche*.'}
],
err:[['Voy trabajar mañana.','Voy a trabajar mañana.','Между ir и инфинитивом нужен a.'],['En lunes tengo cita.','El lunes tengo cita.','Дни недели – с el, не с en.'],['Salgo en las ocho.','Salgo a las ocho.','Час – a las.']],
quiz:[
{k:'c',q:'Mañana ___ a viajar.',o:['voy','estoy','tengo'],a:0,e:'ir a + инфинитив.'},
{k:'c',q:'Tengo cita ___ lunes.',o:['en el','el','a el'],a:1,e:'Перед днём недели – el.'},
{k:'c',q:'Abrimos ___ lunes a viernes.',o:['desde','de','en'],a:1,e:'de… a… – с… до…'},
{k:'f',q:'Завтра я собираюсь работать.',a:'Mañana voy a trabajar',alt:['Voy a trabajar mañana','Yo voy a trabajar mañana'],e:'voy a + инфинитив.'},
{k:'f',q:'Я выхожу в восемь.',a:'Salgo a las ocho',alt:['Yo salgo a las ocho'],e:'a las + час.'}
]},

{id:'t8',lv:2,title:'Estar + герундий: «делаю прямо сейчас»',lead:'Для действия, которое идёт в момент речи. Это не то же самое, что обычное настоящее время.',
secs:[
{h:'Как образуется',p:'estar в нужной форме + герундий. Герундий: к основе добавляем **-ando** (глаголы на -ar) или **-iendo** (-er, -ir).',
 table:[['Инфинитив','Герундий','Пример'],['hablar','habl{ando}','Estoy hablando.'],['comer','com{iendo}','Estamos comiendo.'],['vivir','viv{iendo}','Está viviendo en Madrid.']]},
{h:'Исключения',p:'• *leer → leyendo, oír → oyendo, ir → yendo*\n• -ir с ломкой корня: *dormir → durmiendo, pedir → pidiendo, decir → diciendo, seguir → siguiendo*\n• *poder → pudiendo, venir → viniendo*',
 note:'Возвратные: местоимение либо перед *estar*, либо в конец слитно: *Me estoy duchando* = *Estoy duchándome*.'},
{h:'Прямо сейчас или вообще?',p:'• *Trabajo en una tienda.* – я вообще работаю в магазине (постоянно)\n• *Estoy trabajando.* – я работаю сейчас, в эту минуту',
 ex:[['Ahora estoy cocinando.','Сейчас я готовлю.'],['No puedo hablar, estoy conduciendo.','Я не могу говорить, я за рулём.'],['¿Qué estás haciendo?','Что ты сейчас делаешь?'],['Mis hijos están durmiendo.','Мои дети спят.']]}
],
err:[['Estoy trabajo.','Estoy trabajando.','Нужен герундий, а не форма «я».'],['Estoy comendo.','Estoy comiendo.','У -er/-ir окончание -iendo.'],['Voy trabajando ahora.','Estoy trabajando ahora.','Для «сейчас» нужен estar.']],
quiz:[
{k:'c',q:'Ahora ___ comiendo.',o:['estoy','soy','voy a'],a:0,e:'Идёт сейчас – estar + герундий.'},
{k:'c',q:'Герундий от «beber» –',o:['bebando','bebiendo','bebendo'],a:1,e:'-er → -iendo.'},
{k:'f',q:'Я сейчас готовлю.',a:'Estoy cocinando',alt:['Ahora estoy cocinando','Yo estoy cocinando'],e:'estar + cocinando.'},
{k:'f',q:'Мы говорим по телефону.',a:'Estamos hablando por teléfono',alt:['Estamos hablando por el teléfono'],e:'estamos + hablando.'}
]},

{id:'t9',lv:2,title:'Числа, цены, даты',lead:'Для работы и для поездок: назвать цену, год, дату и номер телефона. Слова выучиваем блоками.',
secs:[
{h:'30–99 и сотни',p:'До 30 числа пишутся слитно (*veintiuno*). С 31 – через **y**: *treinta y uno*, *cuarenta y cinco*, *noventa y nueve*.\nСотни: 100 = *cien* (само по себе), *ciento* (в составе: 101 = *ciento uno*), 200 = *doscientos*, 300 = *trescientos*, 400 = *cuatrocientos*, **500 = quinientos**, 600 = *seiscientos*, **700 = setecientos**, 800 = *ochocientos*, **900 = novecientos**.',
 table:[['Число','Испанский'],['31','treinta y uno'],['47','cuarenta y siete'],['68','sesenta y ocho'],['115','ciento quince'],['250','doscientos cincuenta'],['1 000','mil'],['2 500','dos mil quinientos'],['2025','dos mil veinticinco']]},
{h:'Цены',p:'*euro* – евро, *céntimo* – цент. Читаем так: *3,50 €* = *tres euros con cincuenta*.',
 ex:[['Cuesta doce euros con cincuenta.','Стоит двенадцать евро пятьдесят.'],['¿Cuánto es?','Сколько с меня?'],['Son veinte euros.','С вас двадцать евро.']]},
{h:'Даты',p:'Формула: **el + число + de + месяц + de + год**.\nМесяцы: *enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre* – с маленькой буквы. Дни недели: *lunes, martes, miércoles, jueves, viernes, sábado, domingo*.',
 ex:[['Hoy es el 10 de octubre.','Сегодня 10 октября.'],['Nací en 1975.','Я родилась в 1975 году.'],['Mi cumpleaños es el 3 de mayo.','Мой день рождения – 3 мая.']],
 note:'Год называют целиком: 1975 = *mil novecientos setenta y cinco*. Для первого числа можно сказать *el uno de mayo* (или *el primero de mayo*).'}
],
err:[['cincocientos euros','quinientos euros','500 – особая форма quinientos.'],['treinta uno','treinta y uno','С 31 нужен y.'],['dos cientos','doscientos','Пишется слитно.']],
quiz:[
{k:'c',q:'500 –',o:['cincocientos','quinientos','cinquientos'],a:1,e:'Особая форма: quinientos.'},
{k:'c',q:'Как читается 3,50 €?',o:['tres euros con cincuenta','tres y cincuenta','tres cincuenta euros'],a:0,e:'euros con céntimos.'},
{k:'f',q:'37 (словами)',a:'treinta y siete',alt:[],e:'С 31 – через y.'},
{k:'f',q:'Сегодня 10 октября.',a:'Hoy es el diez de octubre',alt:['Hoy es el 10 de octubre'],e:'el + число + de + месяц.'}
]}
];

{id:'t10',lv:2,title:'Pretérito indefinido: правильные глаголы',lead:'Первое прошедшее время для событий: «вчера я работала», «мы приехали». Окончания надо выучить один раз, и они работают для сотен глаголов.',
secs:[
{h:'Окончания',p:'Для законченного действия в прошлом. Маркеры: *ayer, anoche, la semana pasada, el año pasado, hace dos días*.',
 table:[['','-AR (hablar)','-ER / -IR (comer, vivir)'],['yo','habl{é}','com{í}'],['tú','habl{aste}','com{iste}'],['él/ella/usted','habl{ó}','com{ió}'],['nosotros','habl{amos}','com{imos}'],['vosotros','habl{asteis}','com{isteis}'],['ellos/ustedes','habl{aron}','com{ieron}']],
 note:'Ударение (знак) стоит в формах **yo** и **él**: *hablé, habló, comí, comió*. Без знака смысл меняется: *habló* (он поговорил) ≠ *hablo* (я говорю).'},
{h:'Что нужно запомнить',p:'• у **nosotros** формы на -ar в прошедшем и настоящем одинаковы: *hablamos* («говорим» или «говорили») – смысл по контексту\n• глаголы с «ботинком» (e→ie, o→ue) в -ar/-er **не** меняются: *pensé, volvió*. А вот в -ir меняются в 3 лице: *dormir → durmió, durmieron*; *pedir → pidió, pidieron*\n• *leer → leyó, leyeron*\n• изменения в написании у yo: *llegar → llegué*, *buscar → busqué*, *empezar → empecé*',
 ex:[['Ayer trabajé diez horas.','Вчера я работала десять часов.'],['El año pasado viajamos a España.','В прошлом году мы ездили в Испанию.'],['Comí con mis hijos.','Я пообедала с детьми.'],['Mi hijo llegó tarde.','Мой сын пришёл поздно.'],['¿Qué compraste?','Что ты купила?'],['Escribí un correo al cliente.','Я написала письмо клиенту.']]}
],
err:[['Ayer trabajo mucho.','Ayer trabajé mucho.','При «вчера» нужно прошедшее.'],['Ayer ella hablo conmigo.','Ayer ella habló conmigo.','Для «он/она» в прошлом нужно ударение: habló.'],['Yo llegé','Yo llegué','Чтобы сохранить звук [г], после g нужен u.']],
quiz:[
{k:'c',q:'Ayer yo ___ un café.',o:['bebí','bebé','bebo'],a:0,e:'-er: yo → -í.'},
{k:'c',q:'Mi hijo ___ muy tarde.',o:['llegó','llegé','llego'],a:0,e:'Él → -ó.'},
{k:'c',q:'Ellos ___ a las diez.',o:['salieron','salaron','salen'],a:0,e:'-ir: ellos → -ieron.'},
{k:'f',q:'Вчера мы работали.',a:'Ayer trabajamos',alt:['Ayer nosotros trabajamos'],e:'nosotros: -amos.'},
{k:'f',q:'Я приехала вчера.',a:'Llegué ayer',alt:['Ayer llegué','Yo llegué ayer'],e:'llegar → llegué.'}
]},

{id:'t11',lv:2,title:'Pretérito: ser/ir и самые частые неправильные',lead:'Самые нужные неправильные глаголы выучиваем как «пары»: у них нет обычных окончаний, но есть единая схема.',

{h:'Hacer, ver, dar – без ударений',p:'',

{h:'Схема для остальных: -e, -iste, -o, -imos, -isteis, -ieron',p:'Корень изменён, окончания без ударений: -**e**, -**iste**, -**o**, -**imos**, -**isteis**, -**ieron**.',
 table:[['Инфинитив','Корень','Yo','Él','Ellos'],['estar','estuv-','estuve','estuvo','estuvieron'],['tener','tuv-','tuve','tuvo','tuvieron'],['poder','pud-','pude','pudo','pudieron'],['poner','pus-','puse','puso','pusieron'],['venir','vin-','vine','vino','vinieron'],['querer','quis-','quise','quiso','quisieron']]},
 {h:'В речи',p:'',ex:[['Estuve en casa todo el día.','Я была дома весь день.'],['Tuvimos una reunión importante.','У нас была важная встреча.'],['No pude llamarte.','Я не смогла тебе позвонить.'],['Mi madre vino ayer.','Моя мама приходила вчера.'],['Hicimos una reserva.','Мы сделали бронь.']]}

{k:'c',q:'Nosotros ___ una reserva.',o:['hacimos','hicimos','hizimos'],a:1,e:'hacer → hicimos.'},

{k:'f',q:'У нас была встреча.',a:'Tuvimos una reunión',alt:['Tuvimos una cita'],e:'tener → tuvimos.'},

]},

{id:'t12',lv:2,title:'Pretérito: decir, traer и «-ir с ломкой»',lead:'Ещё одна группа неправильных, плюс ловушка в глаголах на -ir.',
secs:[
{h:'Корень на -j-: decir, traer, conducir',p:'После **j** в форме 3 лица мн. числа окончание **-eron** (не -ieron).',
 table:[['','decir','traer','conducir'],['yo','dije','traje','conduje'],['tú','dijiste','trajiste','condujiste'],['él/ella','dijo','trajo','condujo'],['nosotros','dijimos','trajimos','condujimos'],['ellos','dijeron','trajeron','condujeron']]},
{h:'-ir с «ботинком»: ломается 3 лицо',p:'У глаголов вроде *pedir, dormir, preferir, repetir, seguir* корень меняется **только** в формах él/ella и ellos: e → i, o → u.',
 table:[['','pedir','dormir'],['yo','pedí','dormí'],['él/ella','p{i}dió','d{u}rmió'],['nosotros','pedimos','dormimos'],['ellos','p{i}dieron','d{u}rmieron']],
 ex:[['Mi hijo pidió una pizza.','Мой сын заказал пиццу.'],['Anoche dormí muy bien.','Прошлой ночью я спала очень хорошо.'],['Dijo que sí.','Он сказал, что да.'],['Trajeron el postre.','Принесли десерт.']]},
{h:'Saber и ещё несколько',p:'*saber → supe, supiste, supo…*; *haber (hay) → hubo* («было, произошло»).',
 note:'У *saber* в прошедшем смысл другой: *Supe la noticia* – «я узнала новость». Умение – *sabía* (имперфект, позже).'}
],
err:[['Ellos dijieron','Ellos dijeron','После j окончание -eron.'],['Mi hijo pedió una pizza.','Mi hijo pidió una pizza.','В -ir в 3 лице e → i: pidió.'],['Yo dijo que sí.','Yo dije que sí.','Dijo – это он/она. Для yo – dije.']],
quiz:[
{k:'c',q:'Ayer ella me ___ la verdad.',o:['dijo','dició','dijó'],a:0,e:'decir → dijo.'},
{k:'c',q:'Mis hijos ___ pizza.',o:['pedieron','pidieron','pedaron'],a:1,e:'pedir: 3 лицо мн. → pidieron.'},
{k:'f',q:'Они принесли десерт.',a:'Trajeron el postre',alt:['Trajeron un postre'],e:'traer → trajeron.'},
{k:'f',q:'Я сказала, что да.',a:'Dije que sí',alt:['Yo dije que sí'],e:'decir → dije.'}
]},

{id:'t13',lv:2,title:'Pretérito perfecto: «я уже сделала»',lead:'Время для действий, которые связаны с настоящим: «сегодня», «на этой неделе», «уже», «ещё не».',
secs:[
{h:'Образование',p:'**haber** + причастие. Причастие: -ar → **-ado**, -er/-ir → **-ido**. Причастие не меняется по роду и числу.',
 table:[['yo','tú','él/ella','nosotros','vosotros','ellos'],['he','has','ha','hemos','habéis','han']],
 ex:[['He trabajado mucho hoy.','Я сегодня много работала.'],['¿Has comido ya?','Ты уже поела?'],['Hemos terminado el informe.','Мы закончили отчёт.']]},
{h:'Неправильные причастия',p:'• *hacer → hecho* • *ver → visto* • *escribir → escrito* • *decir → dicho* • *poner → puesto* • *abrir → abierto* • *volver → vuelto* • *romper → roto*',
 ex:[['He hecho la reserva.','Я сделала бронь.'],['No he visto tu mensaje.','Я не видела твоё сообщение.'],['¿Has escrito al cliente?','Ты написала клиенту?']]},
{h:'Когда использовать',p:'• в слове-маркере есть «сегодня / в этом …»: *hoy, esta mañana, esta semana, este año*\n• *ya* (уже), *todavía no* (ещё нет), *nunca* (никогда), *alguna vez* (когда-нибудь)\n• в Испании так говорят и о недавнем прошлом вообще',
 ex:[['Todavía no he comido.','Я ещё не обедала.'],['Nunca he viajado en avión.','Я никогда не летала на самолёте.'],['Este mes hemos vendido más.','В этом месяце мы продали больше.']],
 note:'Между *haber* и причастием ничего не вставляется: *No he visto*, а не *He no visto*.'}
],
err:[['Hoy trabajé mucho.','Hoy he trabajado mucho.','Если «сегодня» ещё не закончилось – perfecto.'],['Ayer he comido tarde.','Ayer comí tarde.','Со словом «вчера» – indefinido.'],['Ayer he trabajado','Ayer trabajé','При «вчера» – indefinido.']],
quiz:[
{k:'c',q:'Hoy ___ trabajado mucho.',o:['he','soy','hice'],a:0,e:'Сегодня → he + причастие.'},
{k:'c',q:'Причастие от «hacer» –',o:['hacido','hecho','hado'],a:1,e:'Неправильное: hecho.'},
{k:'f',q:'Я ещё не обедала.',a:'Todavía no he comido',alt:['Aún no he comido','Todavia no he comido'],e:'todavía no + he + comido.'},
{k:'f',q:'Мы уже закончили.',a:'Ya hemos terminado',alt:['Hemos terminado ya'],e:'hemos + terminado.'}
]},

{id:'t14',lv:2,title:'Местоимения-дополнения: lo, la, me, te, le',lead:'Чтобы не повторять существительное: «я его вижу», «я ей звоню», «дай мне».',
secs:[
{h:'Прямое дополнение: кого/что',p:'',
 table:[['Кого / что','Слово','Пример'],['меня / тебя','me / te','Me ven. ¿Te llamo?'],['его, это (м.)','lo','Lo veo.'],['её, это (ж.)','la','La compro.'],['нас / вас','nos / os','Nos esperan.'],['их (м.)','los','Los tengo.'],['их (ж.)','las','Las quiero.']],
 ex:[['¿El menú? Lo tengo aquí.','Меню? Оно у меня здесь.'],['¿La cuenta? La pido ahora.','Счёт? Я прошу его сейчас.'],['No los veo.','Я их не вижу.']]},
{h:'Косвенное дополнение: кому',p:'**me, te, le, nos, os, les**. Для третьего лица – *le* (ему/ей/вам) и *les* (им).',
 ex:[['Te mando un mensaje.','Я пришлю тебе сообщение.'],['Le doy el libro a mi madre.','Я даю книгу маме.'],['Les llamo mañana.','Я позвоню им завтра.'],['¿Me ayudas?','Ты мне поможешь?']]},
{h:'Где стоит',p:'• перед спрягаемым глаголом: *Lo compro.*\n• с инфинитивом – перед парой или слитно в конце: *Lo voy a comprar* = *Voy a comprarlo*\n• с запретом: *No lo compres.*',
 note:'Когда рядом «кому» и «что»: *Se lo doy* – «Я даю это ему». Вместо le/les перед lo/la/los/las – всегда **se**.'}
],
err:[['Yo veo lo.','Lo veo.','Местоимение стоит перед глаголом.'],['Doy le el libro.','Le doy el libro.','Та же проблема.'],['Le lo doy.','Se lo doy.','le + lo → se lo.']],
quiz:[
{k:'c',q:'– ¿Dónde está el libro? – ___ tengo aquí.',o:['Lo','La','Le'],a:0,e:'Libro – м.р. → lo.'},
{k:'c',q:'Mañana ___ mando un mensaje a mi madre.',o:['la','le','lo'],a:1,e:'Кому? Маме → косвенное дополнение le.'},
{k:'f',q:'Я его вижу. (el coche)',a:'Lo veo',alt:['Lo veo.'],e:'lo + veo.'},
{k:'f',q:'Я пришлю тебе сообщение.',a:'Te mando un mensaje',alt:['Te envío un mensaje','Te mando un mensaje.'],e:'te + mando.'}
]},

{id:'t15',lv:2,title:'Сравнения: más, menos, tan… como',lead:'Сравнить цены, места, товары: «дороже», «дешевле», «такой же, как».',
secs:[
{h:'Более / менее',p:'**más / menos + прилагательное + que**',
 ex:[['Este hotel es más caro que el otro.','Этот отель дороже другого.'],['Madrid es más grande que Valencia.','Мадрид больше Валенсии.'],['El tren es menos rápido que el avión.','Поезд менее быстрый, чем самолёт.']]},
{h:'Такой же, как',p:'**tan + прилагательное + como**; для количества – **tanto/-a/-os/-as + существительное + como**.',
 ex:[['Mi coche es tan bueno como el tuyo.','Моя машина такая же хорошая, как твоя.'],['No tengo tanto tiempo como tú.','У меня не так много времени, как у тебя.']]},
{h:'Исключения',p:'',
 table:[['Форма','Значение'],['bueno → mejor','лучше'],['malo → peor','хуже'],['grande → mayor / más grande','старше (о людях) / больше'],['pequeño → menor / más pequeño','младше / меньше']],
 ex:[['Este restaurante es mejor.','Этот ресторан лучше.'],['Mi hermano es mayor que yo.','Мой брат старше меня.']]},
{h:'Самый…',p:'**el / la más + прилагательное + de**: *la más barata de la tienda*.',
 ex:[['Es el hotel más barato de la ciudad.','Это самый дешёвый отель в городе.'],['Es la mejor opción.','Это лучший вариант.']]}
],
err:[['más mejor','mejor','mejor уже значит «лучше».'],['más barato como','más barato que','Сравнение – que, равенство – como.'],['el más caro en la ciudad','el más caro de la ciudad','После superlativo – de.']],
quiz:[
{k:'c',q:'Este hotel es ___ caro que el otro.',o:['más','tan','mejor'],a:0,e:'más… que.'},
{k:'c',q:'Mi coche es tan bueno ___ el tuyo.',o:['que','como','de'],a:1,e:'tan… como.'},
{k:'f',q:'Это лучший вариант.',a:'Es la mejor opción',alt:['Es la mejor opcion'],e:'la mejor opción.'},
{k:'f',q:'Мой брат старше меня.',a:'Mi hermano es mayor que yo',alt:['Mi hermano es más mayor que yo'],e:'mayor que.'}
]},

{id:'t16',lv:3,title:'Imperfecto: «раньше», «было», «когда я была…»',lead:'Второе прошедшее время: не событие, а фон, привычка и описание. Без него нельзя рассказать, как было раньше.',
secs:[
{h:'Окончания',p:'Основа + окончание. Все три группы очень просты, и форм-исключений всего три.',
 table:[['','-AR (hablar)','-ER / -IR (comer, vivir)'],['yo','habl{aba}','com{ía}'],['tú','habl{abas}','com{ías}'],['él/ella','habl{aba}','com{ía}'],['nosotros','habl{ábamos}','com{íamos}'],['vosotros','habl{abais}','com{íais}'],['ellos','habl{aban}','com{ían}']],
 note:'Исключения: **ser** – *era, eras, era, éramos, erais, eran*; **ir** – *iba, ibas, iba, íbamos, ibais, iban*; **ver** – *veía, veías…*'},
{h:'Когда нужен imperfecto',p:'• **привычка в прошлом** («раньше, каждый день»): *Antes trabajaba todos los días.*\n• **описание** (какой, где, сколько лет): *Era un pueblo pequeño.*\n• **фон и состояние**: *Hacía frío y llovía.*\n• **время и возраст**: *Eran las cinco. Tenía veinte años.*\nМаркеры: *antes, siempre, a menudo, cuando era niña, todos los días, mientras*.',
 ex:[['De niña vivía en un pueblo.','В детстве я жила в деревне.'],['Siempre comíamos juntos.','Мы всегда обедали вместе.'],['Mi abuela cocinaba muy bien.','Моя бабушка прекрасно готовила.'],['Hacía mucho calor.','Было очень жарко.'],['Mientras trabajaba, escuchaba música.','Пока я работала, я слушала музыку.']]}
],
err:[['Antes trabajé aquí.','Antes trabajaba aquí.','Привычка/период – imperfecto.'],['Yo ibaba','Yo iba','Ir – исключение: iba.'],['Comiaba','Comía','-er/-ir: -ía.']],
quiz:[
{k:'c',q:'Antes yo ___ en Kiev.',o:['viví','vivía','vivo'],a:1,e:'«Раньше жила» – imperfecto.'},
{k:'c',q:'Cuando ___ niña, vivía en un pueblo.',o:['fui','era','soy'],a:1,e:'Описание – era.'},
{k:'f',q:'Раньше я работала каждый день.',a:'Antes trabajaba todos los días',alt:['Antes yo trabajaba todos los días','Trabajaba todos los días'],e:'trabajaba (привычка).'},
{k:'f',q:'Было холодно.',a:'Hacía frío',alt:['Hacia frio'],e:'Фон: hacía.'}
]},

{id:'t17',lv:3,title:'Indefinido или imperfecto?',lead:'Главный вопрос рассказа о прошлом. Думайте как режиссёр: indefinido – это кадры сюжета, imperfecto – декорации и фон.',
secs:[
{h:'Простое правило',p:'• **Indefinido** – что произошло: событие, шаг в сюжете. Ответ на вопрос «что случилось?»: *llegué, llamó, compramos.*\n• **Imperfecto** – какой была обстановка: погода, возраст, привычка, что происходило фоном. Ответ на «какой/как было?»: *llovía, era, estaba cansada, trabajaba.*',
 table:[['Indefinido (событие)','Imperfecto (фон)'],['Llegué a las cinco.','Eran las cinco.'],['Empezó a llover.','Llovía mucho.'],['Llamó el cliente.','Yo trabajaba.'],['Compramos una casa.','La casa era grande.']]},
{h:'Вместе в одной фразе',p:'Фон + событие: *Cuando llegué, llovía.* («пришла» – событие, «лило» – фон). *Mientras comía, sonó el teléfono.*',
 ex:[['Cuando llegué, mi madre cocinaba.','Когда я пришла, мама готовила.'],['Estaba cansada, por eso me acosté pronto.','Я устала, поэтому легла пораньше.'],['Hacía frío y no salimos.','Было холодно, и мы не вышли.'],['Vivía en Kiev cuando conocí a Pedro.','Я жила в Киеве, когда познакомилась с Педро.']]},
{h:'Подсказки-маркеры',p:'Indefinido: *ayer, anoche, de repente, una vez, la semana pasada, en 2019*.\nImperfecto: *antes, siempre, todos los días, a menudo, mientras, de niña*.'}
],
err:[['Cuando llegué, llovió.','Cuando llegué, llovía.','Фоновая погода – imperfecto.'],['Ayer trabajaba.','Ayer trabajé.','При ayer – событие.'],['Antes viví en Kiev.','Antes vivía en Kiev.','Привычка/период.']],
quiz:[
{k:'c',q:'Cuando ___, mi madre cocinaba.',o:['llegué','llegaba','llegaré'],a:0,e:'Приход – событие.'},
{k:'c',q:'Ayer ___ a mi cliente.',o:['llamaba','llamé','llamo'],a:1,e:'Ayer + законченное → llamé.'},
{k:'c',q:'Hacía frío y ___ mucho.',o:['llovió','llovía','lloverá'],a:1,e:'Фон: llovía.'},
{k:'f',q:'Было холодно, и мы остались дома.',a:'Hacía frío y nos quedamos en casa',alt:['Hacia frio y nos quedamos en casa'],e:'hacía (фон) + quedamos (событие).'}
]},

{id:'t18',lv:3,title:'Imperativo: просьбы и инструкции',lead:'«Скажите», «подождите», «дай мне», «не звони». Вам это нужно в магазинах, на дороге и в бизнесе.',
secs:[
{h:'Tú: утвердительно',p:'Форма **tú** = форма **él** настоящего времени: *hablas → habla*, *comes → come*, *escribes → escribe*.',
 table:[['Инфинитив','Tú (просьба)','Пример'],['hablar','habla','Habla más despacio.'],['esperar','espera','Espera un momento.'],['escribir','escribe','Escribe tu nombre.'],['venir','ven','Ven aquí.']],
 note:'Исключения (выучить наизусть): **di** (decir), **haz** (hacer), **ve** (ir), **pon** (poner), **sal** (salir), **ten** (tener), **ven** (venir), **sé** (ser).'},
{h:'Usted: вежливо',p:'У *usted* форма меняет гласную: -ar → **-e**, -er/-ir → **-a**. *hable, coma, escriba, espere, pase, mire*. Для вежливых просьб это самый нужный вариант.',
 ex:[['Espere un momento, por favor.','Подождите минуту, пожалуйста.'],['Pase, por favor.','Проходите, пожалуйста.'],['Dígame.','Слушаю вас. (Скажите мне.)'],['Firme aquí, por favor.','Подпишите здесь, пожалуйста.'],['Repita, por favor.','Повторите, пожалуйста.']]},
{h:'Отрицательно (no + форма)',p:'**no + hables / no comas / no escribas** для tú и **no hable / no coma** для usted.',
 ex:[['No hables tan rápido.','Не говори так быстро.'],['No se preocupe.','Не беспокойтесь.'],['No me llames ahora.','Не звони мне сейчас.']],
 note:'Местоимения: в утверждении слитно после глагола (*dame, dígame, siéntese*), в отрицании – перед (*no me llames*).'}
],
err:[['Hablas más despacio.','Habla más despacio.','Просьба ≠ форма tú из настоящего.'],['Haces la tarea.','Haz la tarea.','hacer – особая форма haz.'],['No habla tan rápido.','No hables tan rápido.','Запрет – особая форма.']],
quiz:[
{k:'c',q:'(Usted) ___ un momento, por favor.',o:['espera','espere','esperas'],a:1,e:'Usted: -ar → -e.'},
{k:'c',q:'(Tú) ___ aquí. (venir)',o:['vienes','ven','venga'],a:1,e:'ven.'},
{k:'f',q:'Повторите, пожалуйста.',a:'Repita, por favor',alt:['Repita por favor'],e:'repetir → repita.'},
{k:'f',q:'Скажи мне. (tú)',a:'Dime',alt:['Dime.'],e:'di + me.'}
]},

{id:'t19',lv:3,title:'Por и para',lead:'Оба часто переводятся как «для, за». Достаточно четырёх коротких правил для каждого.',
secs:[
{h:'Para: цель и адресат',p:'• **цель**: *Estudio para trabajar en España.*\n• **кому**: *Este regalo es para mi madre.*\n• **срок**: *Lo necesito para el lunes.*\n• **направление**: *Salgo para Madrid.*',
 ex:[['Es un regalo para ti.','Это подарок тебе.'],['Trabajo para una empresa grande.','Я работаю на крупную компанию.'],['Necesito el informe para mañana.','Мне нужен отчёт к завтрашнему дню.']]},
{h:'Por: причина, «через», обмен',p:'• **причина**: *Llego tarde por el tráfico.*\n• **через, по**: *Paso por tu calle.*\n• **за (обмен, цена)**: *Pagué diez euros por esto.*\n• **период**: *por la mañana, por tres días*\n• **спасибо за**: *Gracias por todo.*',
 ex:[['Gracias por tu ayuda.','Спасибо за твою помощь.'],['Paseamos por el parque.','Мы гуляем по парку.'],['Te llamo por teléfono.','Я позвоню тебе по телефону.']]},
{h:'Быстрый тест',p:'Para – «чтобы / кому / к какому сроку». Por – «из-за / через / за». Если можно спросить «**зачем**?» – para; «**из-за чего**?» – por.'}
],
err:[['Gracias para todo.','Gracias por todo.','Благодарность – por.'],['Estudio por trabajar.','Estudio para trabajar.','Цель – para.'],['Un regalo por ti.','Un regalo para ti.','Адресат – para.']],
quiz:[
{k:'c',q:'Este regalo es ___ mi madre.',o:['por','para','de'],a:1,e:'Адресат – para.'},
{k:'c',q:'Gracias ___ tu ayuda.',o:['por','para','a'],a:0,e:'Благодарность – por.'},
{k:'f',q:'Мне это нужно к понедельнику.',a:'Lo necesito para el lunes',alt:['Necesito esto para el lunes'],e:'Срок – para.'},
{k:'f',q:'Я опаздываю из-за пробки.',a:'Llego tarde por el tráfico',alt:['Llego tarde por el atasco','Llego tarde por el trafico'],e:'Причина – por.'}
]},

{id:'t20',lv:3,title:'Будущее и вежливое «хотела бы» (futuro, condicional)',lead:'Два времени с одним принципом: окончания добавляем к полному инфинитиву. Условное особенно полезно в переговорах и в магазинах.',
secs:[
{h:'Futuro simple',p:'Инфинитив + **-é, -ás, -á, -emos, -éis, -án**. Для планов, предположений и обещаний.',
 table:[['yo','tú','él/ella','nosotros','vosotros','ellos'],['hablar{é}','hablar{ás}','hablar{á}','hablar{emos}','hablar{éis}','hablar{án}']],
 ex:[['Mañana te llamaré.','Завтра я тебе позвоню.'],['El lunes tendremos la reunión.','В понедельник у нас будет встреча.'],['Mi madre vendrá en agosto.','Моя мама приедет в августе.']],
 note:'Неправильные основы: *tener → tendr-*, *venir → vendr-*, *poder → podr-*, *hacer → har-*, *decir → dir-*, *salir → saldr-*, *querer → querr-*, *saber → sabr-*. Окончания те же.'},
{h:'Condicional (вежливое «бы»)',p:'Инфинитив + **-ía, -ías, -ía, -íamos, -íais, -ían**. Самые частые: *me gustaría, podría, querría, tendría*.',

/* ===== app_a.js: состояние, голос, помощники, каркас ===== */
const $=s=>document.querySelector(s);
const TODAY=()=>(typeof window.__TODAY==='number')?window.__TODAY:dayNum();
let storeOK=true;

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const o=JSON.parse(raw);
      if(o&&o.v===1&&o.cards&&typeof o.cards==='object'){
        const s=fresh(TODAY());
        for(const k in o) s[k]=o[k];
        s.set=Object.assign(fresh(0).set,o.set||{});
        ['t','r','l','s'].forEach(k=>{s.done[k]=(o.done&&o.done[k])||{};});
        if(!Array.isArray(s.custom)) s.custom=[];
        if(!Array.isArray(s.journal)) s.journal=[];
        return s;
      }
    }
  }catch(e){storeOK=false;}
  return fresh(TODAY());
}
let S=loadState();
let CARDS=[],CARD={};
function rebuild(){CARDS=buildCards(UNITS,S.custom);CARD={};CARDS.forEach(c=>{CARD[c.id]=c;});}
rebuild();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true;}catch(e){storeOK=false;}}
function ensureToday(){
  const t=TODAY();
  if(!S.today||S.today.d!==t) S.today={d:t,done:{},newN:0,pick:null};
  if(!S.started) S.started=t;
}
function touch(f,n){ensureToday();const d=TODAY();const x=S.days[d]||(S.days[d]={r:0,n:0,q:0});x[f]=(x[f]||0)+(n||1);}
function jr(k,t){S.journal.unshift({d:TODAY(),k,t});if(S.journal.length>60) S.journal.length=60;}

/* ===== тексты ===== */
function fmt(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em class="es">$1</em>').replace(/\{(.+?)\}/g,'<b class="end">$1</b>');
}
function plain(s){return String(s).replace(/[{}*]/g,'');}
function paras(s){return String(s).split('\n').filter(x=>x!=='').map(x=>'<p>'+fmt(x)+'</p>').join('');}
function hs(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuf(arr,seed){const r=mulberry32(seed|0);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function plural(n,a,b,c){const m=n%10,k=n%100;if(m===1&&k!==11) return a;if(m>=2&&m<=4&&(k<12||k>14)) return b;return c;}

/* ===== голос ===== */
const SYN=(typeof window!=='undefined'&&window.speechSynthesis)||null;
let VOICES=[];
function loadVoices(){
  if(!SYN) return;
  try{VOICES=SYN.getVoices().filter(v=>/^es([-_]|$)/i.test(v.lang));}catch(e){VOICES=[];}
}
loadVoices();
if(SYN){try{SYN.onvoiceschanged=function(){loadVoices();if(!SESS) softRender();};}catch(e){}}
function ttsOK(){return !!SYN&&VOICES.length>0;}
function pickVoice(vi){
  if(!VOICES.length) return null;
  let list=VOICES.slice().sort((a,b)=>(/^es[-_]ES/i.test(b.lang)?1:0)-(/^es[-_]ES/i.test(a.lang)?1:0));
  if(S.set.voice){const f=list.find(v=>v.name===S.set.voice);if(f&&!vi) return f;}
  if(vi&&list.length>1) return list.find(v=>v.name!==(pickVoice(0)||{}).name)||list[0];
  return list[0];
}
let SPK=0;
function stopAll(){SPK++;try{if(SYN) SYN.cancel();}catch(e){}}
function speak(text,o){
  o=o||{};
  return new Promise(res=>{
    if(!SYN||!text){res(false);return;}
    try{
      if(!o.queue) SYN.cancel();
      const u=new SpeechSynthesisUtterance(plain(text));
      u.lang='es-ES';
      const v=pickVoice(o.vi||0);
      if(v){u.voice=v;u.lang=v.lang;}
      u.rate=o.rate||S.set.rate||0.9;
      u.pitch=o.pitch||1;
      let done=false;
      const fin=()=>{if(!done){done=true;res(true);}};
      u.onend=fin;u.onerror=fin;
      setTimeout(()=>{try{SYN.speak(u);}catch(e){fin();}},o.queue?0:40);
      setTimeout(fin,25000);
    }catch(e){res(false);}
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const KIND_RU={t:'Теория',r:'Чтение',l:'Аудирование',s:'Орфография'};
const LISTS=()=>({t:LESSONS,r:READS,l:DIALOGS,s:SPELL});
function stageProg(n){
  let total=0,seen=0,mast=0;
  UNITS.filter(u=>u.lv===n).forEach(u=>{const st=unitStats(S,CARDS,u.id);total+=st.total;seen+=st.seen;mast+=st.mast;});
  return {total,seen,mast,pct:total?Math.round((seen*0.6+mast*0.4)/total*100):0};

function todayPick(){
  ensureToday();
  if(!S.today.pick){
    const p=pickLesson(S,LISTS());
    S.today.pick=p?{kind:p.kind,id:p.item.id}:{none:1};
    save();
  }
  const pk=S.today.pick;
  if(pk.none) return null;
  const item=LISTS()[pk.kind].find(x=>x.id===pk.id);
  return item?{kind:pk.kind,item}:null;
}
function itemDone(kind,id){return S.done[kind][id]!==undefined;}
function completeItem(kind,id,score){
  const first=S.done[kind][id]===undefined;
  const prev=S.done[kind][id];
  S.done[kind][id]={s:Math.max(score,prev?prev.s:0),d:TODAY()};
  ensureToday();
  const pk=S.today.pick;
  if(pk&&pk.kind===kind&&pk.id===id&&!S.today.done.lesson){S.today.done.lesson=1;S.cyc=(S.cyc||0)+1;}
  touch('q');
  save();
  return first;
}
function nextStep(){

/* ===== app_b.js: сессии (слова, диктанты, орфография, тесты) ===== */
const ACT={};
const KINDLBL={new:'Новое слово',rev:'Повторение',retry:'Ещё раз',plc:'Проверка знаний',dict:'Диктант',spell:'Орфография',line:'Диктант по реплике'};
const SPECIAL=['á','é','í','ó','ú','ñ','ü','¿','¡'];

function startSess(o){
  stopAll();

function afterAsk(){

/* ---- элементы заданий ---- */
function wordItem(id,type,mode){
  const c=CARD[id];
  return {id,type,mode:mode||'ru',ru:c.ru,es:c.es,accept:answersOf(c),ex:c.ex,exr:c.exr,speak:c.es,hintOK:type!=='new'&&type!=='plc',tries:0};
}
function sentItem(es,ru,type){
  return {type:type||'dict',mode:ttsOK()?'audio':'copy',ru,es,accept:[es],ex:'',exr:'',speak:es,hintOK:false,sentence:true,tries:0};
}
function buildDaily(){
  ensureToday();
  const d=TODAY();
  const due=dueIds(S,CARD,d);
  const items=[];
  due.slice(0,40).forEach(id=>{const r=S.cards[id];const aud=ttsOK()&&r.s>=3&&(r.r%2===1);items.push(wordItem(id,'rev',aud?'audio':'ru'));});
  const cap=Math.max(0,S.set.newN-S.today.newN);
  newIds(S,CARDS,cap).forEach(id=>items.push(wordItem(id,'new','ru')));
  return {items,due:due.length};
}
function startWords(){
  const b=buildDaily();
  if(!b.items.length){toast('Слов на сегодня больше нет');return;}
  startSess({k:'type',sub:'words',title:'Слова',items:b.items,daily:true});
}
function buildDict(seed,n){
  const r=mulberry32(seed);
  const seen=Object.keys(S.cards).map(id=>CARD[id]).filter(c=>c&&c.ex&&c.ex.split(/\s+/).length<=9&&!/\d/.test(c.ex));
  seen.sort((a,b)=>(S.cards[a.id].s-S.cards[b.id].s)||(r()-0.5));
  const pool=shuf(seen.slice(0,14),seed);
  const out=pool.slice(0,Math.min(3,n)).map(c=>[c.ex,c.exr]);
  let k=S.set.dictI||0;
  while(out.length<n){
    const b=DICT_BASIC[k%DICT_BASIC.length];k++;
    if(!out.some(x=>x[0]===b[0])) out.push(b);
    if(k>200) break;
  }
  S.set.dictI=k;
  return out;
}
function startDict(daily){
  const seed=daily?TODAY()*7+3:Date.now()&0xffff;
  const arr=buildDict(seed,4);
  save();
  startSess({k:'type',sub:'dict',title:'Диктант',items:arr.map(x=>sentItem(x[0],x[1],'dict')),daily:!!daily});
}
function startPlc(){
  const items=[];
  UNITS.slice(0,6).forEach((u,i)=>{
    shuf(u.cards.map((c,j)=>u.id+'-'+(j+1)),i*13+5).filter(id=>!S.cards[id]).slice(0,4).forEach(id=>items.push(wordItem(id,'plc','ru')));
  });
  startSess({k:'type',sub:'plc',title:'Проверка знаний',items:shuf(items,99)});
}
function startUnitReview(uid){
  const ids=Object.keys(S.cards).filter(id=>CARD[id]&&CARD[id].unit===uid).sort((a,b)=>S.cards[a].s-S.cards[b].s).slice(0,15);
  if(!ids.length){toast('В этой теме пока нет изученных слов');return;}
  startSess({k:'type',sub:'unit',title:'Повторение темы',items:ids.map(id=>wordItem(id,'rev','ru'))});
}
function startHard(){
  const ids=hardIds(S,CARD,12);
  if(!ids.length){toast('Пока нет слов, в которых вы ошибались');return;}
  startSess({k:'type',sub:'hard',title:'Слабые места',items:ids.map(id=>wordItem(id,'rev','ru'))});
}
function startSpell(id){
  const d=SPELL.find(x=>x.id===id);
  const items=d.items.map(w=>({type:'spell',mode:ttsOK()?'audio':'ru',ru:w[1],es:w[0],accept:[w[0]],ex:'',exr:'',speak:w[0],hintOK:true,tries:0,note:d.rule}));
  startSess({k:'type',sub:'spell',title:d.title,refId:id,items});
}
function startLines(dlg,idxs){
  const items=idxs.map(i=>sentItem(dlg.lines[i][1],dlg.lines[i][2],'line'));
  startSess({k:'type',sub:'lines',title:'Диктант по диалогу',items});
}

function sameAcc(a,b){const f=x=>String(x).toLowerCase().normalize('NFC').replace(/[¿¡?!.,;:"«»()…\-–—]/g,' ').replace(/\s+/g,' ').trim();return f(a)===f(b);}
function resHTML(s,it){
  const res=it.res;
  const v=res==='ok'?['ok','Верно','check']:(res==='typo'?['typo','Почти: опечатка','check']:[ 'wrong',it.typed?'Не совсем':'Правильный ответ','x']);
  let h='<div class="kind">'+KINDLBL[it.type]+'</div><div class="verdict '+v[0]+'">'+ic(v[2])+' '+v[1]+'</div>';

  }else{
    h+='<div class="row"><div class="answer es grow">'+esc(it.es)+'</div><button class="iconbtn acc" data-act="play" data-w="cur" aria-label="Слушать">'+ic('sound')+'</button></div>';
    if(res==='ok'&&!it.accept.some(a=>sameAcc(a,it.typed))) h+='<div class="note">Не забудьте знак: <b>'+esc(it.es)+'</b></div>';
  }
  if(it.ru&&(it.mode!=='ru'||it.type==='new')) h+='<div class="small" style="margin-top:6px">'+esc(it.ru)+'</div>';

  if(it.needCopy&&!it.copied){
    h+='<div class="sub" style="margin-top:14px">Впиши правильный ответ ещё раз, глядя на него. Так он лучше запомнится.</div>'+inputHTML('cpy','','#cchk')+charBar('cpy')+'<div class="btns"><button class="btn" id="cchk" data-act="cchk">Готово</button></div>';

function summaryType(s){
  const tot=s.st.ok+s.st.part+s.st.bad;
  const pct=tot?Math.round((s.st.ok+s.st.part*0.5)/tot*100):0;
  let h='<section class="card"><div class="kind">'+esc(s.title)+' · итог</div><div class="ringw"><div class="ring" style="--p:'+pct+'"><div><b>'+pct+'%</b><span>точность</span></div></div></div>';
  h+='<p style="text-align:center;margin:0 0 6px">С первого раза верно: <b>'+s.st.ok+' из '+tot+'</b></p>';
  if(s.st.part) h+='<p class="small" style="text-align:center;margin:0">Почти (опечатка): '+s.st.part+'</p>';
  if(s.newCount) h+='<p class="small" style="text-align:center;margin:0">Новых слов: '+s.newCount+'</p>';

  if(rl.length) h+='<div class="sec-h">Над чем поработать</div>'+rl.map(r=>'<div class="rule"><b class="t">'+esc(r.title)+'</b>'+fmt(r.text)+'</div>').join('');
  const more=(s.sub==='words'&&s.daily)?dueIds(S,CARD,TODAY()).length:0;
  h+='<div class="btns">';
  if(more>0) h+='<button class="btn soft" data-act="again">Ещё '+Math.min(more,40)+' '+plural(Math.min(more,40),'карточка','карточки','карточек')+'</button>';
  if(s.sub==='dict') h+='<button class="btn soft" data-act="moredict">Ещё диктант</button>';
  h+='<button class="btn" data-act="quit">'+(s.daily?'К плану дня':'Готово')+'</button></div></section>';
  return h;
}

/* ---- логика ответа ---- */
function applySRS(it,res){
  const d=TODAY();
  if(it.type==='rev'){
    const rec=S.cards[it.id];if(!rec) return;
    const out=(res==='ok'&&!it.hint)?'good':(res==='wrong'?'again':'hint');
    S.cards[it.id]=applyReview(rec,out,d);touch('r');
  }else if(it.type==='new'){
    S.cards[it.id]=res==='ok'?{s:2,d:d+STEPS[2],l:0,r:1}:{s:0,d:d+1,l:0,r:1};
    S.today.newN++;touch('n');SESS.newCount++;
  }else if(it.type==='plc'){
    if(res==='ok'||res==='typo') S.cards[it.id]={s:3,d:d+STEPS[3],l:0,r:1};
    touch('q');
  }else if(it.type!=='retry'){touch('q');}
}
function requeue(it){
  if((it.tries||0)>=2) return;
  const s=SESS;
  const r=Object.assign({},it,{type:it.id?'retry':it.type,tries:(it.tries||0)+1,res:null,typed:'',hint:false,needCopy:false,copied:false,rules:null});
  if(it.id) r.mode='ru';
  s.items.splice(Math.min(s.i+4,s.items.length),0,r);
}
function resolve(res,typed){
  const s=SESS,it=s.items[s.i];
  it.res=res;it.typed=typed;s.phase='res';s.draft='';
  if(res!=='ok'&&typed){
    const sh=soundHints(typed,it.es,RULES);
    it.rules=sh.rules.slice(0,it.sentence?3:1);
    it.rules.forEach(r=>{S.rc[r.id]=(S.rc[r.id]||0)+1;s.rules[r.id]=r;});
  }
  const first=!(it.tries>0);
  if(first){
    s.st[res==='ok'?'ok':(res==='typo'?'part':'bad')]++;
    applySRS(it,res);
  }
  it.needCopy=res==='wrong'&&it.type!=='plc'&&it.es.length<=40&&it.mode!=='copy';
  if(res==='wrong'&&it.type!=='plc'&&it.type!=='line') requeue(it);
  save();
  if(S.set.auto&&ttsOK()) speak(it.speak);
  render();
}
function keepDraft(){const i=$('#ans');if(i&&SESS) SESS.draft=i.value;}
function finishSess(){
  const s=SESS;s.fin=true;
  const tot=s.st.ok+s.st.part+s.st.bad;
  const pct=tot?Math.round((s.st.ok+s.st.part*0.5)/tot*100):0;
  if(s.daily&&s.sub==='words') S.today.done.words=1;
  if(s.daily&&s.sub==='dict') S.today.done.dict=1;
  if(s.sub==='plc') S.set.plcDone=1;
  if(s.sub==='spell') completeItem('s',s.refId,pct);
  jr(s.sub,s.title+': '+pct+'%');
  save();
}
ACT.chk=()=>{
  const s=SESS;if(!s)return;
  const it=s.items[s.i],i=$('#ans');
  const val=(i?i.value:'').trim();
  if(!val){toast('Сначала напиши ответ');return;}
  resolve(matchType(val,it.accept),val);
};
ACT.giveup=()=>{if(SESS) resolve('wrong','');};
ACT.hint=()=>{keepDraft();SESS.items[SESS.i].hint=true;render();};
ACT.showru=()=>{keepDraft();SESS.showRu=true;render();};
ACT.cchk=()=>{
  const s=SESS,it=s.items[s.i],i=$('#cpy');
  const val=(i?i.value:'').trim();
  if(matchType(val,it.accept)==='wrong'){toast('Не совпало. Посмотри на слово ещё раз');return;}
  it.copied=true;render();
};
ACT.next=()=>{
  const s=SESS;if(!s)return;
  stopAll();
  s.i++;s.phase='ask';s.draft='';s.showRu=false;
  if(s.i>=s.items.length) finishSess();
  render();afterAsk();
};
ACT.play=d=>{
  const s=SESS;if(!s)return;
  const it=s.items[s.i];if(!it)return;
  if(!ttsOK()){toast('На этом устройстве нет испанского голоса');return;}
  speak(d.w==='ex'?it.ex:it.speak,{rate:d.w==='slow'?0.55:undefined});
};
ACT.ins=d=>{
  const el=$('#'+d.for);if(!el)return;
  const a=el.selectionStart==null?el.value.length:el.selectionStart,b=el.selectionEnd==null?a:el.selectionEnd;
  el.value=el.value.slice(0,a)+d.c+el.value.slice(b);
  el.focus();const p=a+d.c.length;try{el.setSelectionRange(p,p);}catch(e){}
};
ACT.quit=()=>{stopAll();SESS=null;render();try{window.scrollTo(0,0);}catch(e){}};
ACT.again=()=>{SESS=null;startWords();};
ACT.moredict=()=>{SESS=null;startDict(false);};

/* ---- тесты ---- */
function startQuiz(src,id,title,items){
  const arr=items.map(q=>{
    const it=Object.assign({},q);
    if(it.k==='c') it.ord=shuf(it.o.map((_,i)=>i),hs(id+it.q));
    return it;
  });
  startSess({k:'quiz',sub:'quiz',src,refId:id,title,items:arr,score:0,picked:null});
}
function renderQuiz(){
  const s=SESS,n=s.items.length;
  if(s.fin){
    const pct=Math.round(s.score/n*100);
    return sessTop(s,n)+'<main class="wrap"><section class="card"><div class="kind">'+esc(s.title)+' · итог</div><div class="ringw"><div class="ring" style="--p:'+pct+'"><div><b>'+pct+'%</b><span>'+s.score+' из '+n+'</span></div></div></div><p style="text-align:center">'+(pct>=80?'Отлично. Тема усвоена.':(pct>=60?'Хорошо. Через пару дней вернитесь к этой теме ещё раз.':'Стоит перечитать тему и пройти тест снова.'))+'</p><div class="btns">'+(pct<80?'<button class="btn soft" data-act="quizagain">Пройти ещё раз</button>':'')+'<button class="btn" data-act="quit">Готово</button></div></section></main>';
  }
  const it=s.items[s.i];
  let h=sessTop(s,n)+'<main class="wrap"><section class="card q"><div class="kind">'+esc(s.title)+'</div><div class="prompt sm">'+fmt(it.q)+'</div>';
  if(it.k==='c'){
    h+='<div class="opts">'+it.ord.map((oi,di)=>{
      let c='opt';
      if(s.picked!==null){if(oi===it.a) c+=' right';else if(di===s.picked) c+=' wrong';}
      return '<button class="'+c+'" data-act="qpick" data-i="'+di+'"'+(s.picked!==null?' disabled':'')+'>'+fmt(it.o[oi])+'</button>';
    }).join('')+'</div>';
  }else{
    h+='<div class="sub">Напиши по-испански.</div>';

function readHTML(r){
  const gl=r.gl.map((g,i)=>({g,i,k:g[0].toLowerCase()})).sort((a,b)=>b.k.length-a.k.length);
  const pat=gl.map(x=>x.k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  let re;
  try{re=new RegExp('(?<![\\p{L}])('+pat+')(?![\\p{L}])','giu');}catch(e){re=new RegExp('('+pat+')','gi');}
  const byK={};gl.forEach(x=>{byK[x.k]=x.i;});
  return r.text.split('\n').map(p=>{
    let out='',last=0,m;
    re.lastIndex=0;
    while((m=re.exec(p))){
      out+=esc(p.slice(last,m.index));
      const i=byK[m[0].toLowerCase()];
      out+=i===undefined?esc(m[0]):'<span class="gw" data-act="gl" data-i="'+i+'">'+esc(m[0])+'</span>';
      last=m.index+m[0].length;
      if(m[0].length===0) re.lastIndex++;
    }
    return '<p>'+out+esc(p.slice(last))+'</p>';
  }).join('');
}

ACT.dquiz=d=>{const D=DIALOGS.find(x=>x.id===d.id);startQuiz('l',D.id,D.title,D.qs.map(q=>({k:'c',q:q.q,o:q.o,a:0,e:''})));};
ACT.dplay=async d=>{
  const D=DIALOGS.find(x=>x.id===V.arg);if(!D) return;
  if(!ttsOK()){toast('На этом устройстве нет испанского голоса');return;}
  const sp=[];
  const slow=d.slow==='1';
  const tok=++SPK;
  try{SYN.cancel();}catch(e){}
  for(let i=0;i<D.lines.length;i++){
    if(tok!==SPK) break;
    const l=D.lines[i];
    let vi=sp.indexOf(l[0]);if(vi<0){sp.push(l[0]);vi=sp.length-1;}
    document.querySelectorAll('.dl.now').forEach(e=>e.classList.remove('now'));
    const el=document.getElementById('dl'+i);if(el) el.classList.add('now');
    await speak(l[1],{queue:true,vi:vi%2,pitch:vi%2?1.2:0.92,rate:slow?0.6:undefined});
    await sleep(250);
  }
  if(tok===SPK) document.querySelectorAll('.dl.now').forEach(e=>e.classList.remove('now'));
};
ACT.dline=d=>{speak(DIALOGS.find(x=>x.id===V.arg).lines[+d.i][1],{vi:+d.vi,pitch:+d.vi?1.2:0.92});};
ACT.ddict=d=>{
  const D=DIALOGS.find(x=>x.id===d.id);
  const idx=shuf(D.lines.map((_,i)=>i),Date.now()&0xffff).slice(0,4).sort((a,b)=>a-b);
  startLines(D,idx);
};

/* ===== ПРОФИЛЬ ===== */
function heatHTML(){
  const t=TODAY(),wd=(t+3)%7,start=t-wd-11*7;
  let h='<div class="heat">';
  for(let w=0;w<12;w++){
    h+='<div class="col">';
    for(let k=0;k<7;k++){
      const day=start+w*7+k;
      if(day>t){h+='<i class="fut"></i>';continue;}
      const x=S.days[day];
      const a=x?(x.r||0)+(x.n||0)*2+(x.q||0)*3:0;
      h+='<i class="'+(a>=50?'l4':(a>=25?'l3':(a>=10?'l2':(a>0?'l1':''))))+'"></i>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

  }

  h+='<label class="fl" for="s_rate">Скорость речи</label><select id="s_rate" data-set="rate">'+[[0.7,'Медленно'],[0.8,'Спокойно'],[0.9,'Обычно'],[1,'Быстро']].map(o=>'<option value="'+o[0]+'"'+(S.set.rate===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  h+='<label class="fl" for="s_voice">Голос</label>';
  if(VOICES.length) h+='<select id="s_voice" data-set="voice"><option value="">Автоматически</option>'+VOICES.map(v=>'<option value="'+esc(v.name)+'"'+(S.set.voice===v.name?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('')+'</select><div class="btns"><button class="btn ghost sm" data-act="say" data-x="Hola, me llamo Ana. ¿Cómo estás?">'+ic('sound')+' Проверить голос</button></div>';
  else h+='<div class="note" style="margin:0">Испанский голос на этом устройстве не найден. Курс работает, но диктанты превратятся в переписывание, а диалоги можно только читать. Лучше всего открыть курс на смартфоне или в Chrome / Safari.</div>';

  h+='<div class="sec-h">Резервный код</div><section class="card"><p class="lead" style="margin-top:0">Прогресс хранится в этом браузере. Если вы смените телефон или очистите данные, он пропадёт. Сохраните код и вставьте его на новом устройстве.</p><div class="btns"><button class="btn" data-act="mkcode">Показать мой код</button></div><textarea id="code" readonly placeholder="Здесь появится код" style="margin-top:12px"></textarea><div class="btns"><button class="btn ghost" data-act="cpcode">'+ic('copy')+' Скопировать</button></div><label class="fl" for="imp">Восстановить из кода</label><textarea id="imp" placeholder="Вставьте код сюда"></textarea><div class="btns"><button class="btn soft" data-act="impcode">Восстановить</button></div></section>';

  else h+='<div class="btns"><button class="btn ghost" data-act="toggle" data-k="reset">Сбросить прогресс</button></div>';
  if(S.journal.length) h+='<div class="sec-h">Недавнее</div><section class="card flat" style="padding:4px 16px">'+S.journal.slice(0,6).map(j=>'<div class="wl"><div class="grow small">'+esc(j.t)+'</div><span class="small muted">'+(t-j.d===0?'сегодня':(t-j.d===1?'вчера':(t-j.d)+' дн. назад'))+'</span></div>').join('')+'</section>';
  return h;
}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s);}
function unb64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);return a;}
async function makeCode(){
  const json=JSON.stringify(pack(S));
  const bytes=new TextEncoder().encode(json);
  if(typeof CompressionStream!=='undefined'){
    try{
      const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();
      w.write(bytes);w.close();
      const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());
      return 'ES2:'+b64(buf);
    }catch(e){}
  }
  return 'ES1:'+b64(bytes);
}
async function readCode(code){
  code=String(code).replace(/\s+/g,'');
  let json;
  if(code.startsWith('ES2:')){
    const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
    w.write(unb64(code.slice(4)));w.close();
    json=new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  }else if(code.startsWith('ES1:')){
    json=new TextDecoder().decode(unb64(code.slice(4)));
  }else throw new Error('format');
  const o=unpack(JSON.parse(json),TODAY());
  if(!o) throw new Error('data');
  return o;
}
ACT.mkcode=async()=>{const c=await makeCode();const t=$('#code');if(t){t.value=c;t.focus();t.select();}};
ACT.cpcode=async()=>{
  const t=$('#code');if(!t||!t.value){toast('Сначала нажмите «Показать мой код»');return;}
  try{await navigator.clipboard.writeText(t.value);toast('Код скопирован');}
  catch(e){t.focus();t.select();try{document.execCommand('copy');toast('Код скопирован');}catch(e2){toast('Выделите код и скопируйте вручную');}}
};
ACT.impcode=async()=>{
  const t=$('#imp');if(!t||!t.value.trim()){toast('Вставьте код в поле');return;}
  try{
    const o=await readCode(t.value);
    S=o;ensureToday();rebuild();save();toast('Прогресс восстановлен');render();
  }catch(e){toast('Код не подошёл. Проверьте, что скопирован целиком');}
};
ACT.resetgo=()=>{S=fresh(TODAY());S.set.plcDone=0;rebuild();save();V.ui={};toast('Прогресс удалён');render();};

/* ===== запуск ===== */
document.addEventListener('click',e=>{
  const g=$('#gloss');
  if(g&&g.classList.contains('on')&&!e.target.closest('#gloss')&&!e.target.closest('.gw')) g.classList.remove('on');
  const t=e.target.closest('[data-act]');

  const fn=ACT[t.dataset.act];
  if(fn){try{const r=fn(t.dataset,t,e);if(r&&r.catch) r.catch(err=>console.error(err));}catch(err){console.error(err);}}
});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-act="ins"]')) e.preventDefault();});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('input[data-enter]')){
    e.preventDefault();
    const b=document.querySelector(e.target.dataset.enter);
    if(b) b.click();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(!el.matches||!el.matches('[data-set]')) return;
  const k=el.dataset.set,v=el.value;
  if(k==='newN') S.set.newN=+v;
  else if(k==='rate') S.set.rate=+v;
  else if(k==='auto') S.set.auto=v==='1';
  else if(k==='voice') S.set.voice=v;
  save();toast('Сохранено');
});
window.addEventListener('pagehide',save);
window.__app={get S(){return S;},set S(v){S=v;},ACT,go,render,get SESS(){return SESS;},get V(){return V;},startWords,startDict,TODAY,CARD:()=>CARD,buildDaily};
render();

})();
